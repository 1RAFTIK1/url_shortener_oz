version: "2"

run:
  timeout: 3m

linters:
  default: standard       # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose 
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - noctx
    - nilerr
    - copyloopvar
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - dupl

formatters:
  enable:
    - gofmt
    - goimports