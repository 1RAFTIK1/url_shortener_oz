name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: integration tests
        run: go test -tags=integration ./... -count=1 -timeout=10m

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: url-shortener:ci

      - name: smoke test образа
        run: |
          docker run -d --name shortener -p 8081:8081 url-shortener:ci
          for i in $(seq 1 20); do
            if curl -fsS localhost:8081/healthz > /dev/null; then break; fi
            sleep 1
          done
          code=$(curl -fsS -XPOST localhost:8081/api/v1/links \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://ozon.ru"}' | sed -E 's/.*"code":"([^"]+)".*/\1/')
          curl -fsS "localhost:8081/$code" | grep -q 'ozon.ru'
          docker rm -f shortener